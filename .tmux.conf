# Clear inherited PROMPT_COMMAND so panes don't reference undefined functions
set -g default-command "env -u PROMPT_COMMAND bash"

# Use "`" and "C-b" as prefixes
unbind C-b
set -g prefix `
set -g prefix2 C-b
bind ` send-prefix
bind C-b send-prefix -2

# Set vi mode for selection
setw -g mode-keys vi

# Use ctrl + hljk to select panes
bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R

# And also normal prefix + hljk
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# splitting panes
bind | split-window -h
bind - split-window -v

# Colors
# Pane borders
set -g pane-border-style fg=colour88,bg=default
set -g pane-active-border-style fg=red,bg=default

# Command / message line
set -g message-style fg=red,bg=black,bright

# Set status bar
set -g status-style fg=red,bg=black
set -g status-left ""
set -g status-right ""
